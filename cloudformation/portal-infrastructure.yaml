AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Portal production infrastructure — ap-southeast-5
  Covers: Security Groups, RDS, ALB, EC2 (portal-1 & portal-2)
  Deploy this stack FIRST, then deploy portal-cf-waf.yaml in us-east-1

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Default: vpc-02e129cd9a0d72fc5

  PublicSubnet1:
    Type: AWS::EC2::Subnet::Id
    Default: subnet-04675f0f8212bd7a8
    Description: portal-subnet-public1-ap-southeast-5a

  PublicSubnet2:
    Type: AWS::EC2::Subnet::Id
    Default: subnet-0561bfa812c199359
    Description: portal-subnet-public2-ap-southeast-5b

  PrivateSubnet1:
    Type: AWS::EC2::Subnet::Id
    Default: subnet-02d14f65de5937d4b
    Description: portal-subnet-private1-ap-southeast-5a (portal-1)

  PrivateSubnet2:
    Type: AWS::EC2::Subnet::Id
    Default: subnet-034e15b10c757d956
    Description: portal-subnet-private2-ap-southeast-5b (portal-2)

  PortalAMI:
    Type: AWS::EC2::Image::Id
    Default: ami-04c7b81f22c04be89
    Description: AMI ID for portal-1 and portal-2 instances

  InstanceType:
    Type: String
    Default: m7i.xlarge

  DBPassword:
    Type: String
    NoEcho: true
    Description: MySQL root/admin password for portal-db

  DBName:
    Type: String
    Default: radiomuzikfm

  ALBCertificateArn:
    Type: String
    Default: arn:aws:acm:ap-southeast-5:759371407156:certificate/6af47129-b18d-43c1-ab6f-bb97614726d4
    Description: ACM cert for portal.radiomuzik.com in ap-southeast-5 (for ALB HTTPS listener)

  CloudFrontPrefixListId:
    Type: String
    Default: pl-09076f83e90b139d0
    Description: CloudFront origin-facing managed prefix list (ap-southeast-5)

  InternalVpcCidr1:
    Type: String
    Default: 10.10.0.0/16
    Description: ai-vpc CIDR via TGW

  InternalVpcCidr2:
    Type: String
    Default: 192.168.0.0/16
    Description: radio-vpc CIDR via TGW

Resources:

  # -------------------------------------------------------
  # Security Groups
  # -------------------------------------------------------
  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: portal-alb-sg
      GroupDescription: Security group for portal ALB
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP from internet
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS from internet
      Tags:
        - Key: Name
          Value: portal-alb-sg

  PortalSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: portal-sg
      GroupDescription: Portal Security Group
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourceSecurityGroupId: !Ref ALBSecurityGroup
          Description: HTTP from ALB
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          SourceSecurityGroupId: !Ref ALBSecurityGroup
          Description: HTTPS from ALB
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
          Description: SSH (restrict to bastion in production)
        - IpProtocol: -1
          CidrIp: !Ref InternalVpcCidr1
          Description: ai-vpc-via-tgw
        - IpProtocol: -1
          CidrIp: !Ref InternalVpcCidr2
          Description: radio-vpc-via-tgw
      Tags:
        - Key: Name
          Value: portal-sg

  RDSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: portal-rds-sg
      GroupDescription: Security group for portal RDS MySQL
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          SourceSecurityGroupId: !Ref PortalSecurityGroup
          Description: MySQL from portal EC2
      Tags:
        - Key: Name
          Value: portal-rds-sg

  EFSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: portal-efs-sg
      GroupDescription: Security group for portal EFS
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 2049
          ToPort: 2049
          SourceSecurityGroupId: !Ref PortalSecurityGroup
          Description: NFS from portal EC2
      Tags:
        - Key: Name
          Value: portal-efs-sg

  # -------------------------------------------------------
  # RDS
  # -------------------------------------------------------
  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupName: portal-db-subnet-group
      DBSubnetGroupDescription: Subnet group for portal RDS
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2

  PortalDB:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    Properties:
      DBInstanceIdentifier: portal-db
      DBInstanceClass: db.t3.small
      Engine: mysql
      EngineVersion: '8.0.45'
      DBName: !Ref DBName
      MasterUsername: admin
      MasterUserPassword: !Ref DBPassword
      AllocatedStorage: 20
      StorageType: gp3
      MultiAZ: false
      DBSubnetGroupName: !Ref DBSubnetGroup
      VPCSecurityGroups:
        - !Ref RDSSecurityGroup
      BackupRetentionPeriod: 7
      DeletionProtection: true
      Tags:
        - Key: Name
          Value: portal-db

  # -------------------------------------------------------
  # Application Load Balancer
  # -------------------------------------------------------
  PortalALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: portal-alb
      Type: application
      Scheme: internet-facing
      SecurityGroups:
        - !Ref ALBSecurityGroup
      Subnets:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2
      LoadBalancerAttributes:
        - Key: idle_timeout.timeout_seconds
          Value: '60'
        - Key: routing.http2.enabled
          Value: 'true'
      Tags:
        - Key: Name
          Value: portal-alb

  PortalTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: portal-tg
      Protocol: HTTP
      Port: 80
      VpcId: !Ref VpcId
      TargetType: instance
      HealthCheckPath: /
      HealthCheckProtocol: HTTP
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: '300'
        - Key: stickiness.enabled
          Value: 'false'
      Targets:
        - Id: !Ref Portal1Instance
        - Id: !Ref Portal2Instance

  ALBListenerHTTP:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref PortalALB
      Protocol: HTTP
      Port: 80
      DefaultActions:
        - Type: redirect
          RedirectConfig:
            Protocol: HTTPS
            Port: '443'
            StatusCode: HTTP_301

  ALBListenerHTTPS:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref PortalALB
      Protocol: HTTPS
      Port: 443
      Certificates:
        - CertificateArn: !Ref ALBCertificateArn
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref PortalTargetGroup

  # -------------------------------------------------------
  # EC2 Instances
  # -------------------------------------------------------
  Portal1Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref PortalAMI
      InstanceType: !Ref InstanceType
      SubnetId: !Ref PrivateSubnet1
      SecurityGroupIds:
        - !Ref PortalSecurityGroup
      Tags:
        - Key: Name
          Value: portal-1

  Portal2Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref PortalAMI
      InstanceType: !Ref InstanceType
      SubnetId: !Ref PrivateSubnet2
      SecurityGroupIds:
        - !Ref PortalSecurityGroup
      Tags:
        - Key: Name
          Value: portal-2

Outputs:
  ALBDNSName:
    Value: !GetAtt PortalALB.DNSName
    Description: ALB DNS name — use this as origin in portal-cf-waf.yaml
    Export:
      Name: PortalALBDNSName

  ALBHostedZoneId:
    Value: !GetAtt PortalALB.CanonicalHostedZoneID
    Description: ALB hosted zone ID — use this in portal-cf-waf.yaml Route 53 alias
    Export:
      Name: PortalALBHostedZoneId

  Portal1Id:
    Value: !Ref Portal1Instance

  Portal2Id:
    Value: !Ref Portal2Instance

  RDSEndpoint:
    Value: !GetAtt PortalDB.Endpoint.Address
    Description: RDS connection endpoint
