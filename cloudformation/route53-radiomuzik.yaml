      Name: _7691a9422683bfb6b52a4779a3cc5f68.radiomuzik.com.
      Type: CNAME
      TTL: 300
      ResourceRecords:
        - _c90c9162dfd3df57c752c3ecf2eb1256.jkddzztszm.acm-validations.aws.

  ACMValidationDocs:
