  ACMValidationStream:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZone
      Name: _4871e3c9fc30c9e12aa2b1e828a4161c.stream.radiomuzik.com.
      Type: CNAME
      TTL: 300
