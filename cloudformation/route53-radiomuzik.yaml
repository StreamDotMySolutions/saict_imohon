AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Route 53 Hosted Zone and DNS records for radiomuzik.com
  NOTE: NS and SOA records are auto-created by AWS — not included here
  NOTE: ACM validation CNAMEs are auto-managed by ACM — included for reference only

Parameters:
  ALBDNSName:
    Type: String
    Default: portal-alb-1779190685.ap-southeast-5.elb.amazonaws.com
    Description: Portal ALB DNS name

  ALBHostedZoneId:
    Type: String
    Default: Z04476843M3I0MJM2PHJM
    Description: Portal ALB canonical hosted zone ID

Resources:

  # -------------------------------------------------------
  # Hosted Zone
  # -------------------------------------------------------
  HostedZone:
    Type: AWS::Route53::HostedZone
    Properties:
      Name: radiomuzik.com.

  # -------------------------------------------------------
  # Root domain and www → ALB (alias)
  # -------------------------------------------------------
  RootARecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZone
      Name: radiomuzik.com.
      Type: A
      AliasTarget:
        HostedZoneId: !Ref ALBHostedZoneId
        DNSName: !Ref ALBDNSName
        EvaluateTargetHealth: true

  WwwARecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZone
      Name: www.radiomuzik.com.
      Type: A
      AliasTarget:
        HostedZoneId: !Ref ALBHostedZoneId
        DNSName: !Ref ALBDNSName
        EvaluateTargetHealth: true

  PortalARecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZone
      Name: portal.radiomuzik.com.
      Type: A
      AliasTarget:
        HostedZoneId: !Ref ALBHostedZoneId
        DNSName: !Ref ALBDNSName
        EvaluateTargetHealth: true

  # -------------------------------------------------------
  # Staging → CloudFront (alias)
  # -------------------------------------------------------
  StagingARecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZone
      Name: staging.radiomuzik.com.
      Type: A
      AliasTarget:
        HostedZoneId: Z2FDTNDATAQYW2
        DNSName: d34bpbw58g5u4b.cloudfront.net.
        EvaluateTargetHealth: false

  # -------------------------------------------------------
  # live / stream / docs → CloudFront (CNAME)
  # -------------------------------------------------------
  LiveCNAME:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZone
      Name: live.radiomuzik.com.
      Type: CNAME
      TTL: 300
      ResourceRecords:
        - d22a77t6lz6bm6.cloudfront.net

  StreamCNAME:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZone
      Name: stream.radiomuzik.com.
      Type: CNAME
      TTL: 300
      ResourceRecords:
        - d1u3i1iw0ghy00.cloudfront.net

  DocsCNAME:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZone
      Name: docs.radiomuzik.com.
      Type: CNAME
      TTL: 300
      ResourceRecords:
        - dpufdsdbe7jem.cloudfront.net

  # -------------------------------------------------------
  # Infrastructure A records
  # -------------------------------------------------------
  BastionARecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZone
      Name: bastion.radiomuzik.com.
      Type: A
      TTL: 300
      ResourceRecords:
        - 56.69.33.230

  CMSARecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZone
      Name: cms.radiomuzik.com.
      Type: A
      TTL: 300
      ResourceRecords:
        - 56.69.33.230

  IcecastOriginARecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZone
      Name: icecast-origin.radiomuzik.com.
      Type: A
      TTL: 60
      ResourceRecords:
        - 43.216.131.143

  # -------------------------------------------------------
  # ACM DNS Validation CNAMEs
  # (auto-managed by ACM — recreate if certs are recreated)
  # -------------------------------------------------------
