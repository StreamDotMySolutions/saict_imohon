      ResourceRecords:
        - _6ce925a0d7134b6c205f9c705a8fc07d.jkddzztszm.acm-validations.aws.

  ACMValidationLive:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZone
      Name: _13b1f6fdce308820fb1531ff1dd7e2e0.live.radiomuzik.com.
      Type: CNAME
      TTL: 300
      ResourceRecords:
        - _972d16b461b010fdd21e200a3a66cbc1.jkddzztszm.acm-validations.aws.

