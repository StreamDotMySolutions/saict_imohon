# Default server configuration
#
server {
	server_name imohon.rtm.gov.my;

    	#location /api {
        #        proxy_pass http://127.0.0.1:8000;
    	#}

        location /api {
             client_max_body_size 256M;
             alias /var/www/html/saict_imohon/backend/public;
             index index.php;
             try_files $uri $uri/ @laravelapi;

             # pass PHP scripts to FastCGI server
            location ~ \.php$ {
                #include snippets/fastcgi-php.conf;
                fastcgi_pass unix:/run/php/php8.2-fpm.sock;
                include fastcgi_params;
                fastcgi_param SCRIPT_FILENAME $request_filename;
                fastcgi_param SCRIPT_NAME /api$fastcgi_script_name;
            }
        }

         location @laravelapi {
             rewrite /api/(.*)?$ /api/index.php?$is_args$args last;
        }

        location /storage {
                index index.html;
                alias /var/www/html/saict_imohon/backend/storage/app/public/;
        }

        # User manual. Serves only the manual and its screenshots - the capture
        # tooling lives in tools/manual-capture and is deliberately not exposed,
        # since its README carries demo credentials and server paths.
        #
        # Uses root, NOT alias, and the location has a trailing slash. With
        # "location /docs" + alias, a request for "/docs../backend/.env" matches
        # the prefix and resolves outside the docs directory - that leaks the
        # production .env and .git. Do not change these two details.
        location = /docs {
                return 301 /docs/;
        }

        location /docs/ {
                root /var/www/html/saict_imohon;
                index manual-pengguna-imohon.html;
                autoindex off;
        }


        location / {
                root /var/www/html/saict_imohon/frontend/build;
                index index.html;
                try_files $uri $uri/ /index.html;
        }

    	location = /favicon.ico { access_log off; log_not_found off; }
    	location = /robots.txt  { access_log off; log_not_found off; }

    	error_page 404 /index.php; 


	location ~ /\.ht {
		deny all;
	}

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/imohon.rtm.gov.my/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/imohon.rtm.gov.my/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = imohon.rtm.gov.my) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


	listen 80;


	server_name imohon.rtm.gov.my;
    return 404; # managed by Certbot


}
